<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Pulsing Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="4" stroke-dasharray="16 8" />

  <!-- Orbiting Nodes -->
  <circle cx="160" cy="120" r="10" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="360" cy="380" r="8" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="380" cy="170" r="6" fill="#3b82f6" />

  <!-- Central Core Orb -->
  <circle cx="256" cy="256" r="110" fill="url(#glowGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="85" fill="#030712" />

  <!-- S / AI Sound Wave Emblem -->
  <path d="M 210 210 C 210 170, 270 160, 290 190 C 310 220, 230 240, 230 280 C 230 320, 300 320, 300 320" 
        fill="none" stroke="url(#glowGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Sparkles -->
  <path d="M 256 120 L 262 140 L 282 146 L 262 152 L 256 172 L 250 152 L 230 146 L 250 140 Z" fill="#38bdf8" />
  <circle cx="256" cy="256" r="28" fill="#38bdf8" filter="url(#glow)" opacity="0.9" />
</svg>
